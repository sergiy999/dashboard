<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#eef1f7"/>
<title>мій дашборд</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap&subset=cyrillic" rel="stylesheet"/>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<div class="hero">
  <svg class="hero-car" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(90,90)">
      <ellipse cx="60" cy="240" rx="95" ry="100" fill="#0a0a0a"/>
      <ellipse cx="440" cy="240" rx="95" ry="100" fill="#0a0a0a"/>
      <path d="M60 140 L75 145 L65 175 L80 195 L60 235 L40 195 L55 175 L45 145 Z" fill="#3a3a3c"/>
      <path d="M440 140 L455 145 L445 175 L460 195 L440 235 L420 195 L435 175 L425 145 Z" fill="#3a3a3c"/>
      <path d="M60 245 L78 255 L62 285 L82 305 L60 340 L38 305 L58 285 L42 255 Z" fill="#3a3a3c"/>
      <path d="M440 245 L458 255 L442 285 L462 305 L440 340 L418 305 L438 285 L422 255 Z" fill="#3a3a3c"/>
      <rect x="170" y="180" width="160" height="80" rx="10" fill="#f5f5f7"/>
      <path d="M180 180 L320 180 L300 130 L200 130 Z" fill="#f5f5f7"/>
      <circle cx="250" cy="105" r="22" fill="#0a0a0a"/>
      <rect x="237" y="92" width="26" height="9" rx="4" fill="#e8334a"/>
      <rect x="160" y="92" width="180" height="14" rx="3" fill="#e8334a"/>
      <rect x="80" y="78" width="14" height="60" rx="3" fill="#e8334a"/>
      <rect x="406" y="78" width="14" height="60" rx="3" fill="#e8334a"/>
      <rect x="195" y="260" width="110" height="14" rx="2" fill="#c4c4c8"/>
    </g>
  </svg>
  <div class="hero-text">
    <h1>мій дашборд</h1>
    <div class="sub">7 сфер життя · клікни задачу щоб відредагувати</div>
  </div>
  <div class="header-actions">
    <button class="btn-add-block" onclick="openBlockModal()">+ блок</button>
    <button class="btn-add-block" onclick="showSummary()">📊 підсумок</button>
    <button class="btn-add-block" onclick="exportICS()">📅 в календар</button>
    <button class="btn-add-block" onclick="exportData()">💾 експорт</button>
    <button class="btn-add-block" onclick="openImport()">📂 імпорт</button>
    <div class="meta" id="meta"></div>
  </div>
</div>

<div class="priority-wrap" id="priority-wrap"></div>
<div class="grid" id="grid"></div>

<!-- модалка: новий блок -->
<div class="modal-bg" id="block-modal-bg">
  <div class="modal">
    <h2>новий блок</h2>
    <input class="modal-inp" id="modal-name" placeholder="назва блоку…" onkeydown="if(event.key==='Enter')confirmBlockModal()"/>
    <div class="emoji-pick" id="emoji-pick"></div>
    <div class="modal-actions center">
      <button class="modal-btn" onclick="closeBlockModal()">скасувати</button>
      <button class="modal-btn primary" onclick="confirmBlockModal()">створити</button>
    </div>
  </div>
</div>

<!-- модалка: редагування задачі -->
<div class="modal-bg" id="task-modal-bg">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title">редагування задачі</span>
      <span class="close-x" onclick="closeTaskModal()">✕</span>
    </div>
    <div class="field-label">текст задачі</div>
    <input class="field-inp big" id="et-text"/>
    <div class="row2">
      <div>
        <div class="field-label">📅 термін</div>
        <input type="date" class="field-inp date" id="et-date"/>
      </div>
      <div>
        <div class="field-label">💰 бюджет</div>
        <input class="field-inp" id="et-budget"/>
      </div>
    </div>
    <div class="field-label">💬 коментар</div>
    <input class="field-inp" id="et-comment"/>
    <div class="field-label">🔗 посилання</div>
    <input class="field-inp link" id="et-link" placeholder="https://…"/>
    <div class="modal-actions">
      <button class="modal-btn danger" onclick="deleteFromModal()">видалити задачу</button>
      <button class="modal-btn primary" onclick="saveFromModal()">зберегти</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/blocks.js"></script>
<script src="js/priority.js"></script>
<script src="js/modals.js"></script>
<script src="js/password-gate.js"></script>
<script src="js/tools.js"></script>
<script>
  restoreBackupIfEmpty();
  rebuildGrid();
  renderPriority();
  initModalHandlers();

  /* щоб увімкнути пароль на вхід: розкоментуй рядок нижче
     і встанови свій пароль у js/password-gate.js */
  // initPasswordGate();

  const mons = ['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
  const ds = ['неділя','понеділок','вівторок','середа','четвер','пʼятниця','субота'];
  const now = new Date();
  document.getElementById('meta').textContent = ds[now.getDay()] + ', ' + now.getDate() + ' ' + mons[now.getMonth()];
</script>
</body>
</html>
